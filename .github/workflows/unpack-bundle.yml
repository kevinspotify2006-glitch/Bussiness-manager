name: Unpack bundle

on:
  push:
    paths:
      - 'Business-Manager-from-bundle.zip'
      - '.github/workflows/unpack-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack project
        run: |
          rm -rf src tools package.json tsconfig.json vite.config.ts .gitignore README.md
          unzip -o Business-Manager-from-bundle.zip -d .
          rm -f Business-Manager-from-bundle.zip
      - name: Commit expanded project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No changes to commit.'; else git commit -m 'build: unpack full Business Manager bundle'; git push; fi
