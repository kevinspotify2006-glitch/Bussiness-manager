name: Unpack bundle

on:
  workflow_dispatch:
  push:
    paths:
      - 'Business-Manager-from-bundle.zip'
      - '.github/workflows/unpack-bundle.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack project
        run: |
          rm -rf src tools package.json tsconfig.json vite.config.ts .gitignore README.md index.html
          unzip -o Business-Manager-from-bundle.zip -d .
          rm -f Business-Manager-from-bundle.zip
          # The bundle's CI workflow requires a separate workflows permission.
          # The application itself does not need that workflow, so keep only this deploy helper.
          rm -f .github/workflows/ci.yml

      - name: Commit expanded project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'build: unpack full Business Manager bundle'
            git push
          fi
