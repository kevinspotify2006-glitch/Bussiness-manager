name: Extract playable build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message != 'Extract playable build' && github.event.head_commit.message != 'Clear repository'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP into repository root
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted
          ROOT=$(find extracted -type f -name 'index.html' -print -quit | xargs -r dirname)
          test -n "$ROOT"
          cp -a "$ROOT"/. ./
          rm -rf extracted "$ZIP"
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Extract playable build"
          git push

# Extract ZIP trigger
