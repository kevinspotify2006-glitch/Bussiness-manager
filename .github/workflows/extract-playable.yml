name: Extract playable build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message != 'Extract playable build' && github.event.head_commit.message != 'Clear repository'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract or clear playable build
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -n "$ZIP" ]; then
            mkdir -p extracted
            unzip -o "$ZIP" -d extracted
            INDEX=$(find extracted -type f -name 'index.html' | head -n 1)
            CSS=$(find extracted -type f -name 'main.css' | head -n 1)
            JS=$(find extracted -type f -name 'main.js' | head -n 1)
            test -n "$INDEX" && test -n "$CSS" && test -n "$JS"
            cp "$INDEX" ./index.html
            cp "$CSS" ./main.css
            cp "$JS" ./main.js
            rm -rf extracted "$ZIP"
          else
            find . -maxdepth 1 -type f ! -name '.gitignore' -delete
          fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Clear repository"
          git push

# Trigger repository cleanup while preserving this workflow.
