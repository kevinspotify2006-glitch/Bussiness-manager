<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Manager — Northgate</title>
<style>
:root{--bg:#0a0d12;--panel:#111722;--panel2:#171e2b;--line:#273143;--text:#eef3f8;--muted:#8c98aa;--accent:#58d68d;--warn:#f5c451;--bad:#ef6b73;--blue:#62a8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#172333 0,#0a0d12 42%);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:#0d121a;padding:18px 12px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:20px;padding:10px 12px 24px}.brand span{color:var(--accent)}nav button{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;cursor:pointer}nav button:hover,nav button.active{background:var(--panel2);color:#fff}.main{padding:24px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.title h1{margin:0 0 5px;font-size:28px}.muted{color:var(--muted)}.hud{display:flex;gap:10px;flex-wrap:wrap}.pill{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(180deg,var(--panel),#0e141d);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 10px 30px #0002}.metric{font-size:25px;font-weight:800;margin-top:7px}.positive{color:var(--accent)}.negative{color:var(--bad)}.yellow{color:var(--warn)}.blue{color:var(--blue)}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;padding:9px 13px;border-radius:9px;cursor:pointer}.btn:hover{border-color:#53647d}.btn.primary{background:#1b6040;border-color:#2b8c5c}.btn.danger{background:#61252c;border-color:#87343e}.businesses{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.biz{padding:15px;border:1px solid var(--line);border-radius:12px;background:#101720}.bizhead{display:flex;justify-content:space-between;gap:8px}.tag{font-size:11px;padding:4px 7px;border-radius:99px;background:#202a39;color:#b9c6d7}.bar{height:7px;background:#222c39;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #202936}.row:last-child{border-bottom:0}.log{max-height:260px;overflow:auto}.log .row{font-size:13px}.hidden{display:none}.notice{padding:13px;border-left:3px solid var(--accent);background:#10221a;border-radius:8px}.map{height:330px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(135deg,#12202a,#0d141d);position:relative;overflow:hidden}.district{position:absolute;border:1px solid #314355;background:#172330aa;border-radius:8px;padding:8px;font-size:11px;color:#b6c2d0}.controls{display:flex;gap:8px;align-items:center}.select{background:var(--panel);border:1px solid var(--line);color:#fff;padding:8px;border-radius:8px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow:auto}.grid{grid-template-columns:repeat(2,1fr)}.businesses{grid-template-columns:1fr 1fr}}@media(max-width:600px){.main{padding:15px}.grid,.businesses{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">BUSINESS <span>MANAGER</span></div><nav id="nav"></nav></aside><main class="main"><div class="top"><div class="title"><h1 id="pageTitle">Dashboard</h1><div class="muted">Northgate · Dag <span id="day">1</span> · <span id="time">08:00</span></div></div><div class="hud"><div class="pill">Cash <b id="cash">€25.000</b></div><div class="pill">Net worth <b id="worth">€25.000</b></div></div></div><div id="content"></div></main></div>
<script>
const S={day:1,hour:8,cash:25000,revenue:0,expenses:0,rep:50,awareness:12,paused:false,speed:1,businesses:[],logs:[{d:1,t:'08:00',m:'Welkom in Northgate. Kies je eerste onderneming.'}]};
const types=[['Gemakswinkel','Retail',9000,420,55],['Koffiebar','Food',12500,520,62],['Kledingwinkel','Retail',18000,680,68],['Reparatiebedrijf','Services',10500,450,59],['Dierenwinkel','Retail',15000,410,51],['Schoonmaakbedrijf','Services',8500,360,54]];
const districts=['Central','Riverside','Old Town','Northgate','University','Harbor','West End','Greenfield','East Market','Southbank'];
let route='dashboard';
const navItems=[['dashboard','▦','Dashboard'],['map','⌖','City Map'],['businesses','▣','Businesses'],['finance','€','Finance'],['reports','▤','Reports']];
function money(n){return new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n)}
function log(m){S.logs.unshift({d:S.day,t:String(S.hour).padStart(2,'0')+':00',m});S.logs=S.logs.slice(0,40)}
function renderNav(){nav.innerHTML=navItems.map(x=>`<button class="${route===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('')}
function go(r){route=r;renderNav();pageTitle.textContent=navItems.find(x=>x[0]===r)?.[2]||'Dashboard';render();}
function render(){cash.textContent=money(S.cash);worth.textContent=money(S.cash+S.businesses.reduce((a,b)=>a+b.value,0));day.textContent=S.day;time.textContent=String(S.hour).padStart(2,'0')+':00';
let html='';
if(route==='dashboard')html=`<div class="grid"><div class="card"><div class="muted">Today's revenue</div><div class="metric positive">${money(S.revenue)}</div></div><div class="card"><div class="muted">Today's expenses</div><div class="metric negative">${money(S.expenses)}</div></div><div class="card"><div class="muted">Reputation</div><div class="metric yellow">${S.rep.toFixed(0)}/100</div></div><div class="card"><div class="muted">Awareness</div><div class="metric blue">${S.awareness.toFixed(0)}%</div></div></div><div class="section grid" style="grid-template-columns:2fr 1fr"><div class="card"><h2>Empire overview</h2>${S.businesses.length?S.businesses.map(b=>bizCard(b)).join(''):'<div class="notice">Je hebt nog geen bedrijf. Open je eerste locatie en begin je imperium.</div>'}<div class="actions" style="margin-top:14px"><button class="btn primary" onclick="go('businesses')">Open business manager</button><button class="btn" onclick="advance(24)">Run 24 hours</button></div></div><div class="card"><h2>Live feed</h2><div class="log">${S.logs.map(x=>`<div class="row"><span class="muted">D${x.d} ${x.t}</span><span>${x.m}</span></div>`).join('')}</div></div></div>`;
if(route==='businesses')html=`<div class="card"><h2>Available opportunities</h2><div class="businesses">${types.map((t,i)=>`<div class="biz"><div class="bizhead"><b>${t[0]}</b><span class="tag">${t[1]}</span></div><p class="muted">Fit-out ${money(t[2])} · Rent ${money(t[3])}/day · Potential ${t[4]}%</p><div class="bar"><i style="width:${t[4]}%"></i></div><button class="btn primary" style="margin-top:12px" onclick="openBiz(${i})">Open location</button></div>`).join('')}</div></div><div class="section card"><h2>Your businesses</h2>${S.businesses.length?S.businesses.map((b,i)=>bizCard(b,true,i)).join(''):'<span class="muted">Nothing here yet.</span>'}</div>`;
if(route==='finance')html=`<div class="grid"><div class="card"><div class="muted">Cash</div><div class="metric">${money(S.cash)}</div></div><div class="card"><div class="muted">Lifetime revenue</div><div class="metric positive">${money(S.revenue)}</div></div><div class="card"><div class="muted">Lifetime expenses</div><div class="metric negative">${money(S.expenses)}</div></div><div class="card"><div class="muted">Profit</div><div class="metric ${S.revenue-S.expenses>=0?'positive':'negative'}">${money(S.revenue-S.expenses)}</div></div></div><div class="section card"><h2>Actions</h2><div class="actions"><button class="btn" onclick="marketing()">Marketing campaign €500</button><button class="btn" onclick="loan()">Take €10.000 loan</button><button class="btn" onclick="advance(168)">Run 7 days</button></div></div>`;
if(route==='reports')html=`<div class="grid"><div class="card"><div class="muted">Businesses</div><div class="metric">${S.businesses.length}</div></div><div class="card"><div class="muted">Reputation</div><div class="metric">${S.rep.toFixed(1)}</div></div><div class="card"><div class="muted">Total profit</div><div class="metric ${S.revenue>=S.expenses?'positive':'negative'}">${money(S.revenue-S.expenses)}</div></div><div class="card"><div class="muted">Day</div><div class="metric">${S.day}</div></div></div><div class="section card"><h2>Management advice</h2><div class="row"><span>Demand</span><b>${S.businesses.length?'Growing — invest in awareness and service.':'Open your first location.'}</b></div><div class="row"><span>Liquidity</span><b>${S.cash<5000?'Critical — slow expansion.':'Healthy — you can invest.'}</b></div><div class="row"><span>Reputation</span><b>${S.rep>70?'Strong':'Build consistency through staffing and quality.'}</b></div></div>`;
if(route==='map')html=`<div class="card"><h2>Northgate economic map</h2><p class="muted">District demand, rent and competition at a glance.</p><div class="map">${districts.map((d,i)=>`<div class="district" style="left:${5+(i%5)*18}%;top:${8+Math.floor(i/5)*42}%">${d}<br><span class="muted">Demand ${45+(i*7)%50}%</span></div>`).join('')}</div></div>`;
content.innerHTML=html}
function bizCard(b,full=false,i=0){return `<div class="row"><div><b>${b.name}</b><div class="muted">${b.district} · quality ${b.quality}/100</div></div><div><b class="positive">${money(b.daily)}</b>/day ${full?`<button class="btn danger" onclick="closeBiz(${i})">Close</button>`:''}</div></div>`}
function openBiz(i){let t=types[i];if(S.cash<t[2])return alert('Niet genoeg cash.');S.cash-=t[2];let district=districts[Math.floor(Math.random()*districts.length)];let b={name:t[0],district,value:t[2],daily:0,quality:t[4]};S.businesses.push(b);log(`Je opende ${t[0]} in ${district}.`);render()}
function closeBiz(i){let b=S.businesses[i];S.cash+=Math.round(b.value*.65);log(`${b.name} verkocht voor ${money(Math.round(b.value*.65))}.`);S.businesses.splice(i,1);render()}
function marketing(){if(S.cash<500)return alert('Niet genoeg cash.');S.cash-=500;S.expenses+=500;S.awareness=Math.min(100,S.awareness+9);log('Lokale marketingcampagne gelanceerd. Awareness +9%.');render()}
function loan(){S.cash+=10000;log('€10.000 werkkapitaal geleend.');render()}
function advance(hours){for(let k=0;k<hours;k++){S.hour++;if(S.hour>=24){S.hour=0;S.day++;S.revenue=0;S.expenses=0;S.businesses.forEach(b=>b.daily=0);log('Nieuwe handelsdag gestart.')}S.businesses.forEach(b=>{let demand=180+Math.random()*220;let sale=demand*(.55+b.quality/220)*(S.awareness/100+.55);let rev=Math.round(sale);let cost=Math.round(rev*.56);b.daily+=rev-cost;S.revenue+=rev;S.expenses+=cost;S.cash+=rev-cost;S.rep=Math.max(0,Math.min(100,S.rep+(b.quality>65?.018:-.01)));});if(k%12===0&&S.businesses.length)log('Marktupdate: concurrentie verschuift de vraag.')}render()}
setInterval(()=>{if(!S.paused)advance(S.speed)},3000);renderNav();render();
</script></body></html>
