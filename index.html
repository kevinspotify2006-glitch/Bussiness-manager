<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The scale is locked deliberately. This is a full-screen app shell: the
         map does its own pinch-zoom, every wide table scrolls inside its own
         box, and letting the browser widen the layout viewport pushes dialogs
         and toasts off the side of a phone screen. -->
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1017" />
    <title>Business Manager</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="main.js"></script>
  </body>
</html>
